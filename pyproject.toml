[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durov-agents"
version = "0.1.0"
description = "MVP multi-agent runtime for Durov.House: eight specialists, shared company context, legal gate, labeling."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DUROV-OS / Leo Vesin" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
durov-agents = "durov_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
durov_agents = ["specs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
